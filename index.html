<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Schody</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
			background-color:black;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
			overflow: hidden;
		}

		div#gameContainer canvas {
			position: absolute;
			left: 0;
			top: 0;
			display: block;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: optimizeSpeed;
			image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}
	</style>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" data-pixel-art="false"></canvas>
		<script src="Build/WebGL.loader.js"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");
			var config = {
				dataUrl: "Build/WebGL.data.unityweb",
				frameworkUrl: "Build/WebGL.framework.js.unityweb",
				codeUrl: "Build/WebGL.wasm.unityweb",
				streamingAssetsUrl: "StreamingAssets",
				companyName: "DefaultCompany",
				productName: "Schody",
				productVersion: "0.1.0",
			};
			var scaleToFit;
			try {
				scaleToFit = !!JSON.parse("true");
			} catch (e) {
				scaleToFit = true;
			}
			function progressHandler(progress) {
				var percent = progress * 100 + '%';
				canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
				canvas.style.backgroundSize = '100% 1rem';
			}
			function onResize() {
				var container = canvas.parentElement;
				var viewportWidth = Math.max(1, window.innerWidth);
				var viewportHeight = Math.max(1, window.innerHeight);
				var w;
				var h;

				if (scaleToFit) {
					// Fit within both viewport dimensions without cropping the canvas.
					var aspect = 1280 / 720;
					w = Math.max(1, Math.min(viewportWidth, Math.floor(viewportHeight * aspect)));
					h = Math.max(1, Math.min(viewportHeight, Math.floor(w / aspect)));
				} else {
					w = 1280;
					h = 720;
				}

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((viewportHeight - h) / 2) + "px";
				container.style.left = Math.floor((viewportWidth - w) / 2) + "px";
			}

			// Set the layout before Unity starts so its first UI layout sees
			// the intended canvas size rather than the HTML default (300x150).
			onResize();
			window.addEventListener('resize', onResize);

			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				canvas = instance.Module.canvas;

				// Unity may adjust the backing canvas during startup. Reapply
				// sizing after paint and notify Unity's resize listeners once.
				requestAnimationFrame(function () {
					onResize();
					requestAnimationFrame(function () {
						window.dispatchEvent(new Event('resize'));
					});
				});
			});

			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				// Mobile device style: fill the whole browser client area with the game canvas:
				const meta = document.createElement('meta');
				meta.name = 'viewport';
				meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
				document.getElementsByTagName('head')[0].appendChild(meta);
			}
		</script>
						<script>
							window.addEventListener("keydown", function(e) {
								if(e.ctrlKey && e.key === 'w') {
									e.preventDefault();
								}
								if(e.ctrlKey && e.key === 's') {
									e.preventDefault();
								}
								if(e.ctrlKey && e.key === 'd') {
									e.preventDefault();
								}
							});
						</script>
	</div>
</body>

</html>
